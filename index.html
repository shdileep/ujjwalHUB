  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    @keyframes truckMove {
      0% {
        left: -15%;
      }

      100% {
        left: 105%;
      }
    }

    .animate-truck-progress {
      animation: truckMove 3s linear infinite;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Leaflet Customizations */
    .leaflet-container {
      background: #f8fafc;
      font-family: inherit;
    }

    .leaflet-marker-icon {
      transition: transform 0.2s ease-out;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 1.5rem;
      padding: 0.5rem;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
    }

    /* Out of Bound Protection Effects */
    @keyframes golden-boundary-pulse {
      0% {
        filter: drop-shadow(0 0 5px #fbbf24) drop-shadow(0 0 10px #fbbf24);
        opacity: 0.8;
        stroke-width: 4;
      }

      50% {
        filter: drop-shadow(0 0 15px #fbbf24) drop-shadow(0 0 30px #d97706);
        opacity: 1;
        stroke-width: 6;
      }

      100% {
        filter: drop-shadow(0 0 5px #fbbf24) drop-shadow(0 0 10px #fbbf24);
        opacity: 0.8;
        stroke-width: 4;
      }
    }

    .animate-golden-boundary {
      animation: golden-boundary-pulse 1.5s ease-in-out infinite;
    }

    @keyframes sunlight-radiate {
      0% {
        transform: scale(0);
        opacity: 0;
        border-width: 40px;
      }

      20% {
        opacity: 0.6;
      }

      100% {
        transform: scale(4);
        opacity: 0;
        border-width: 2px;
      }
    }

    .sunlight-wave {
      position: absolute;
      border: 2px solid #fbbf24;
      border-radius: 50%;
      pointer-events: none;
      animation: sunlight-radiate 3s cubic-bezier(0.1, 0.7, 1.0, 0.1) forwards;
    }

    @keyframes bin-evaporate {
      0% {
        transform: scale(1) translateY(0);
        filter: blur(0) brightness(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.2) translateY(-20px);
        filter: blur(2px) brightness(2);
        opacity: 0.5;
      }

      100% {
        transform: scale(0) translateY(-100px);
        filter: blur(20px) brightness(5);
        opacity: 0;
      }
    }

    .animate-bin-evaporate {
      animation: bin-evaporate 1.2s ease-in forwards;
    }

    /* Specialized Print Styles for ID Card */
    @media print {
      body * {
        visibility: hidden;
      }

      #root,
      #root * {
        visibility: hidden;
      }

      .print\:block,
      .print\:block * {
        visibility: visible !important;
      }

      .print\:block {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white;
      }

      @page {
        size: A4;
        margin: 0;
      }

      .break-before-page {
        page-break-before: always;
      }
    }
  </style>
